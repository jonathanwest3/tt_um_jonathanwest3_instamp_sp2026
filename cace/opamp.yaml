#--------------------------------------------------------------
# CACE circuit characterization file
#--------------------------------------------------------------

name: opamp
description: Operational amplifier
PDK: sky130A
cace_format: 5.2

authorship:
  designer: Jonathan West
  company: Weber State Univeristy
  creation_date: Nov 4, 2026
  license: Apache 2.0

paths:
  root: ..
  schematic: xschem
  magic: mag
  layout: gds
  netlist: netlist
  documentation: docs

pins:
  Vn:
    description: amplifier voltage negative input
    type: signal
    direction: input
    Vmin: vss - 0.3
    Vmax: vdd + 0.3
  Vp:
    description: amplifier voltage positive input
    type: signal
    direction: input
    Vmin: vss - 0.3
    Vmax: vdd + 0.3
  Vout:
    description: amplifier voltage output
    type: signal
    direction: output
    Vmin: vss
    Vmax: vdd
  Vref:
    description: Reference voltage from bandgap (1.2V)
    type: signal
    direction: output
    Vmin: vss
    Vmax: vdd
  VDD:
    description: Analog power supply
    type: power
    direction: inout
    Vmin: 3.0
    Vmax: 3.6
  GND:
    description: Analog ground
    type: ground
    direction: inout
    Vmin: -0.3
    Vmax: 0.3

default_conditions:
  vdd:
    description: Analog power supply voltage
    display: vdd
    unit: V
    typical: 3.3
  vmid:
    description: Analog mid supply voltage
    display: vmid
    unit: V
    typical: 1.65
  vss:
    description: Analog ground
    display: vss
    unit: V
    typical: 0
  vref:
    description: reference voltage
    display: vref
    unit: V
    typical: 1.23
  Rfb:
    description: Feedback resistance
    display: Rfb
    unit: MΩ
    typical: 10
  Rgnd:
    description: Feedback to gnd resistance
    display: Rgnd
    unit: MΩ
    typical: 1
  Lfb:
    description: Feedback inductance
    display: Lfb
    unit: H 
    typical: 1G
  Cout:
    description: Output load capacitance
    display: CLoad
    unit: fF
    maximum: 100
  Vmid:
    description: Mid supply reference voltage
    display: Vmid
    typical: 1.65
  Vcm:
    description: Common-mode input voltage
    display: Vcm
    typical: 0
  Vdiff:
    description: Differential input voltage
    display: Vdiff
    typical: 0
  temperature:
    description: Ambient temperature
    display: Temp
    unit: °C
    minimum: 0
    typical: 27
    maximum: 80
  corner:
    description: Process corner
    display: Corner
    minimum: ss
    typical: tt
    maximum: ff
  iterations:
    description: Iterations to run
    display: Iterations
    minimum: 1
    maximum: 10
    step: linear
    stepsize: 1
  Rg:
    unit: kΩ
    typical: 17
  Rload:
    unit: kΩ
    typical: 1000
  Cload:
    unit: pF
    typical: 10

parameters:
  gain_20db:
    description: Gain set for 20 dB
    display: Gain 20dB
    unit: dB
    spec:
      gain:
        minimum:
          value: 18
          fail: true
        typical:
          value: 20
        maximum:
          value: 22
          fail: false
      bw:
        unit: kHz
        minimum:
          value: 100
          fail: true
        typical:
          value: 300
    tool:
      ngspice:
        template: gain_opamp.sch
        format: ascii
        suffix: .data
        variables: [gain, bw]
    plot:
      gain_vs_temperature_20dB:
        type: xyplot
        xaxis: temperature
        yaxis: gain
    conditions:
      Rfb:
        unit: MΩ
        typical: 9
      Rgnd:
        unit: MΩ
        typical: 1
      Lfb:
        unit: H
        typical: 1n
      vref:
        unit: V
        minimum: 1.1
        typical: 1.2
        maximum: 1.3

  gain_openloop:
    description: Open loop gain
    display: Open loop gain
    unit: dB
    spec:
      gain:
        minimum:
          value: 70
          fail: true
        typical:
          value: 80
        maximum:
          value: 90
          fail: false
    tool:
      ngspice:
        template: gain_opamp.sch
        format: ascii
        suffix: .data
        variables: [gain, bw]
    plot:
      gain_vs_temperature:
        type: xyplot
        xaxis: temperature
        yaxis: gain
    conditions:
      Rfb:
        unit: Ω
        typical: 1m
      Rgnd:
        unit: MΩ
        typical: 1
      Lfb:
        unit: H
        typical: 10G
      vref:
        unit: V
        minimum: 1.1
        typical: 1.2
        maximum: 1.3
        
  netgen_lvs:
    description: Netgen LVS
    display: Netgen LVS
    spec:
      lvs_errors:
        maximum:
          value: 0
    tool:
      netgen_lvs

  magic_drc:
    description: Magic DRC
    display: Magic DRC
    spec:
      drc_errors:
        maximum:
          value: 0
    tool:
      magic_drc

  magic_antenna:
    description: Magic Antenna
    display: Magic Antenna
    spec:
      antenna_violations:
        maximum:
          value: 0
    tool:
      magic_antenna_check

