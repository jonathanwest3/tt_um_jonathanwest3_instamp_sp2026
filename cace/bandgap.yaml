#--------------------------------------------------------------
# CACE circuit characterization file
#--------------------------------------------------------------

name: bandgap
description: Bandgap reference
PDK: sky130A
cace_format: 5.2

authorship:
  designer: Jonathan West
  company: Weber State Univeristy
  creation_date: Nov 4, 2026
  license: Apache 2.0

paths:
  root: ..
  schematic: xschem
  magic: mag
  layout: gds
  netlist: netlist
  documentation: docs

pins:
  Vref:
    description: Reference voltage from bandgap (1.2V)
    type: signal
    direction: output
    Vmin: vss
    Vmax: vdd
  VDD:
    description: Analog power supply
    type: power
    direction: inout
    Vmin: 3.0
    Vmax: 3.6
  GND:
    description: Analog ground
    type: ground
    direction: inout
    Vmin: -0.3
    Vmax: 0.3

default_conditions:
  vdd:
    description: Analog power supply voltage
    display: vdd
    unit: V
    typical: 3.3
  vss:
    description: Analog ground
    display: vss
    unit: V
    typical: 0
  temperature:
    description: Ambient temperature
    display: Temp
    unit: °C
    minimum: 0
    typical: 27
    maximum: 80
  corner:
    description: Process corner
    display: Corner
    minimum: ss
    typical: tt
    maximum: ff
  iterations:
    description: Iterations to run
    display: Iterations
    minimum: 1
    maximum: 10
    step: linear
    stepsize: 1

parameters:
  refernce:
    description: Reference output voltgae
    display: Reference
    unit: V
    spec:
      ref:
        minimum:
          value: 1.1
          fail: true
        typical:
          value: 1.2
        maximum:
          value: 1.3
          fail: false
    tool:
      ngspice:
        template: bandgap.sch
        format: ascii
        suffix: .data
        variables: [ref]
        
  netgen_lvs:
    description: Netgen LVS
    display: Netgen LVS
    spec:
      lvs_errors:
        maximum:
          value: 0
    tool:
      netgen_lvs

  magic_drc:
    description: Magic DRC
    display: Magic DRC
    spec:
      drc_errors:
        maximum:
          value: 0
    tool:
      magic_drc

  magic_antenna:
    description: Magic Antenna
    display: Magic Antenna
    spec:
      antenna_violations:
        maximum:
          value: 0
    tool:
      magic_antenna_check

