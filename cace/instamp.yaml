#--------------------------------------------------------------
# CACE circuit characterization file
#--------------------------------------------------------------

name: instamp
description: Instrumentaion amplifier
PDK: sky130A
cace_format: 5.2

authorship:
  designer: Jonathan West
  company: Weber State Univeristy
  creation_date: Nov 4, 2026
  license: Apache 2.0

paths:
  root: ..
  schematic: xschem
  magic: mag
  layout: gds
  netlist: netlist
  documentation: docs

pins:
  Vn:
    description: amplifier voltage negative input
    type: signal
    direction: input
    Vmin: vss - 0.3
    Vmax: vdd + 0.3
  Vp:
    description: amplifier voltage positive input
    type: signal
    direction: input
    Vmin: vss - 0.3
    Vmax: vdd + 0.3
  Vout:
    description: amplifier voltage output
    type: signal
    direction: output
    Vmin: vss
    Vmax: vdd
  Vref:
    description: Reference voltage from bandgap (requires 100nF to GND)
    type: signal
    direction: output
    Vmin: vss
    Vmax: vdd
  Rgp:
    description: Gain resistor positive
    type: signal
    direction: output
    Vmin: vss
    Vmax: vdd
  Rgn:
    description: Gain resistor negative
    type: signal
    direction: output
    Vmin: vss
    Vmax: vdd
  VDD:
    description: Analog power supply
    type: power
    direction: inout
    Vmin: 3.0
    Vmax: 3.6
  GND:
    description: Analog ground
    type: ground
    direction: inout
    Vmin: -0.3
    Vmax: 0.3

default_conditions:
  Vvdd:
    description: Analog power supply voltage
    display: vdd
    unit: V
    typical: 3.3
  Vvss:
    description: Analog ground
    display: vss
    unit: V
    typical: 0
  Rout:
    description: Output load resistance
    display: RLoad
    unit: MΩ
    typical: 100
  Cout:
    description: Output load capacitance
    display: CLoad
    unit: fF
    maximum: 100
  Vcm:
    description: Common-mode input voltage
    display: Vcm
    typical: 1.65
  Vdiff:
    description: Differential input voltage
    display: Vdiff
    typical: 0
  temperature:
    description: Ambient temperature
    display: Temp
    unit: °C
    minimum: 0
    typical: 27
    maximum: 100
  corner:
    description: Process corner
    display: Corner
    minimum: ss
    typical: tt
    maximum: ff
  iterations:
    description: Iterations to run
    display: Iterations
    minimum: 1
    maximum: 10
    step: linear
    stepsize: 1

parameters:
  gain_10k:
    description: open loop voltage gain
    display: Gain with 10k Rg
    unit: dB
    spec:
      gain:
        minimum:
          value: 18
          fail: true
        typical:
          value: 25
        maximum:
          value: 30
          fail: true
    tool:
      ngspice:
        template: avo.sch
        format: ascii
        suffix: .data
        variables: [gain]
    plot:
      gain_vs_temperature:
        type: xyplot
        xaxis: temperature
        yaxis: gain

    conditions:
      Rg:
        unit: kΩ
        typical: 10
      Vvdd:
        typical: 3.3
      Vcm:
        typical: 1.65
        note: AC analysis not dependent on Vcm
      temperature:
        unit: °C
        step: linear
        stepsize: 20
        minimum: 0
        maximum: 100
        
  netgen_lvs:
    description: Netgen LVS
    display: Netgen LVS
    spec:
      lvs_errors:
        maximum:
          value: 0
    tool:
      netgen_lvs:
        script: run_project_lvs.tcl

