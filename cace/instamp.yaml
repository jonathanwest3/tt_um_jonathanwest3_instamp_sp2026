#--------------------------------------------------------------
# CACE circuit characterization file
#--------------------------------------------------------------

name: instamp
description: Instrumentaion amplifier
PDK: sky130A
cace_format: 5.2

authorship:
  designer: Jonathan West
  company: Weber State Univeristy
  creation_date: Nov 4, 2026
  license: Apache 2.0

paths:
  root: ..
  schematic: xschem
  magic: mag
  layout: gds
  netlist: netlist
  documentation: docs

pins:
  Vn:
    description: amplifier voltage negative input
    type: signal
    direction: input
    Vmin: vss - 0.3
    Vmax: vdd + 0.3
  Vp:
    description: amplifier voltage positive input
    type: signal
    direction: input
    Vmin: vss - 0.3
    Vmax: vdd + 0.3
  Vout:
    description: amplifier voltage output
    type: signal
    direction: output
    Vmin: vss
    Vmax: vdd
  Vref:
    description: Reference voltage from bandgap (requires 100nF to GND)
    type: signal
    direction: output
    Vmin: vss
    Vmax: vdd
  Rgp:
    description: Gain resistor positive
    type: signal
    direction: output
    Vmin: vss
    Vmax: vdd
  Rgn:
    description: Gain resistor negative
    type: signal
    direction: output
    Vmin: vss
    Vmax: vdd
  VDD:
    description: Analog power supply
    type: power
    direction: inout
    Vmin: 3.0
    Vmax: 3.6
  GND:
    description: Analog ground
    type: ground
    direction: inout
    Vmin: -0.3
    Vmax: 0.3

default_conditions:
  vdd:
    description: Analog power supply voltage
    display: vdd
    unit: V
    typical: 3.3
  vss:
    description: Analog ground
    display: vss
    unit: V
    typical: 0
  Rout:
    description: Output load resistance
    display: RLoad
    unit: MΩ
    typical: 100
  Cout:
    description: Output load capacitance
    display: CLoad
    unit: fF
    maximum: 100
  Vmid:
    description: Mid supply reference voltage
    display: Vmid
    typical: 1.65
  Vcm:
    description: Common-mode input voltage
    display: Vcm
    typical: 0
  Vdiff:
    description: Differential input voltage
    display: Vdiff
    typical: 0
  temperature:
    description: Ambient temperature
    display: Temp
    unit: °C
    typical: 27
    maximum: 80
  corner:
    description: Process corner
    display: Corner
    typical: tt
  iterations:
    description: Iterations to run
    display: Iterations
    minimum: 1
    maximum: 10
    step: linear
    stepsize: 1
  Rg:
    unit: kΩ
    typical: 90
  Rload:
    unit: kΩ
    typical: 1000
  Cload:
    unit: pF
    typical: 10

parameters:
  gain_20:
    description: Gain set for x20 (26 dB)
    display: Gain 26dB
    unit: dB
    spec:
      gain:
        minimum:
          value: 24
          fail: true
        typical:
          value: 26
        maximum:
          value: 28
          fail: true
      bw:
        unit: kHz
        minimum:
          value: 100
          fail: true
        typical:
          value: 300
    tool:
      ngspice:
        template: gain.sch
        format: ascii
        suffix: .data
        variables: [gain, bw]
    plot:
      gain_vs_temperature:
        type: xyplot
        xaxis: temperature
        yaxis: gain
    conditions:
      Rg:
        unit: kΩ
        typical: 8
        
  gain_10:
    description: Gain set for x10 (20dB)
    display: Gain (20dB)
    unit: dB
    spec:
      gain:
        minimum:
          value: 18
          fail: true
        typical:
          value: 20
        maximum:
          value: 22
          fail: false
      bw:
        unit: kHz
        minimum:
          value: 100
          fail: true
        typical:
          value: 200
    tool:
      ngspice:
        template: gain.sch
        format: ascii
        suffix: .data
        variables: [gain, bw]
    plot:
      gain_vs_temperature:
        type: xyplot
        xaxis: temperature
        yaxis: gain

    conditions:
      Rg:
        unit: kΩ
        typical: 17


  rise_fall:
    description: Rise, fall and slew rates
    display: Rise, fall and slew
    spec:
      rise:
        unit: ns
        minimum:
          value: 100
          fail: false
        typical:
          value: 300
        maximum: 
          value: 500 
          fail: true
      fall:
        unit: ns
        minimum:
          value: 100
          fail: false
        typical:
          value: 300
        maximum: 
          value: 500
          fail: true
      sr_rise:
        unit: V/us
        minimum:
          value: 0.5
          fail: true
        typical:
          value: 0.8
        maximum: 
          value: 1.5
          fail: false
      sr_fall:
        unit: V/us
        minimum:
          value: 0.5
          fail: true
        typical:
          value: 0.8
        maximum: 
          value: 1.5
          fail: false
      over:
        unit: mV
        typical:
          value: 1
        maximum: 
          value: 3
          fail: false
      under:
        unit: mV
        typical:
          value: 1
        maximum: 
          value: 3
          fail: false
      ivdd:
        unit: uA
        typical:
          value: 500
        maximum: 
          value: 750
          fail: false
    tool:
      ngspice:
        template: rise.sch
        format: ascii
        suffix: .data
        variables: [rise, fall, sr_rise, sr_fall, over, under, ivdd]
  cmrr:
    description: CMRR and PSRR
    display: CMRR and PSRR
    spec:
      CMRR:
        unit: dB
        minimum:
          value: 60
          fail: false
        typical:
          value: 70
      PSRR:
        unit: dB
        minimum:
          value: 60
          fail: false
        typical:
          value: 70
    tool:
      ngspice:
        template: cmrr.sch
        format: ascii
        suffix: .data
        variables: [CMRR, PSRR]

  noise:
    description: Noise
    display: Noise
    spec:
      noise:
        unit: uV
        typical:
          value: 100
        maximum: 
          value: 300
          fail: false
    tool:
      ngspice:
        template: noise.sch
        format: ascii
        suffix: .data
        variables: [noise]

  netgen_lvs:
    description: Netgen LVS
    display: Netgen LVS
    spec:
      lvs_errors:
        maximum:
          value: 0
    tool:
      netgen_lvs:
        script: run_project_lvs.tcl

  magic_drc:
    description: Magic DRC
    display: Magic DRC
    spec:
      drc_errors:
        maximum:
          value: 0
    tool:
      magic_drc

  magic_antenna:
    description: Magic Antenna
    display: Magic Antenna
    spec:
      antenna_violations:
        maximum:
          value: 0
    tool:
      magic_antenna_check

